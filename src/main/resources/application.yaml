spring:
  application:
    name: payment-service

kafka:
  bootstrap-servers: localhost:9092

server:
  port: 8082

commerce:
  service:
    url: http://localhost:8080

resilience4j:
  retry:
    instances:
      commerceService:
        max-attempts: 3
        wait-duration: 1s

  circuitbreaker:
    instances:
      commerceService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
