spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/commerce_db
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
    ddl-auto: validate  #Automatically updates the database schema to match the entity definitions.
    show-sql: true  #Enables logging of SQL statements generated by Hibernate.
    properties:
      hibernate:
        format_sql: true #Formats the SQL statements for better readability in the logs.

kafka:
  bootstrap-servers: localhost:9092

server:
  port: 8082

commerce:
  service:
    url: http://localhost:8080

resilience4j:
  retry:
    instances:
      commerceService:
        max-attempts: 3
        wait-duration: 1s

  circuitbreaker:
    instances:
      commerceService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
paypal:
  base-url: https://api-m.sandbox.paypal.com
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
